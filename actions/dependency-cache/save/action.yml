name: 'Save dependency cache'
description: 'Saves the dependencies found by dependency-cache/restore. Only saves on the default branch, since caches saved in pull requests are invisible to other branches.'
runs:
  using: 'composite'
  steps:
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: env.DEPENDENCY_CACHE_PATHS != '' && env.DEPENDENCY_CACHE_HIT != 'true' && github.ref_name == github.event.repository.default_branch
      with:
        path: ${{ env.DEPENDENCY_CACHE_PATHS }}
        key: ${{ env.DEPENDENCY_CACHE_KEY }}
