on:
  workflow_call:
    inputs:
      LANGUAGE:
        required: false
        type: string
        default: "java"
      CODEQL_ENABLED:
        required: false
        type: boolean
        default: true
      TEAM:
        required: false
        type: string
        default: "teampam"
      JAVA_DISTRIBUTION:
        required: false
        type: string
        default: "temurin"
      JAVA_VERSION:
        required: false
        type: string
        default: "14"
      NODE_VERSION:
        required: false
        type: string
        default: "14"
      BUILD_CACHE:
        required: false
        type: string
        default: "gradle"
      NAIS_RESOURCE:
        required: false
        type: string
        default: "naiserator.yml"
      NAIS_VARS:
        required: false
        type: string
        default: "naiserator-dev.json"
      CLUSTER:
        required: false
        type: string
        default: "dev-gcp"
      BUILD_SCRIPT:
        required: false
        type: string
        default: "./build.sh"
      WORKING_DIRECTORY:
        required: false
        type: string
        default: "./"
      IMAGE_SUFFIX:
        required: false
        type: string
      SKIP_DRAFT_RELEASE:
        required: false
        type: boolean
        default: false
      DRAFTS_MAX:
        required: false
        type: string
        default: "10"
      VERSION_TAG:
        required: false
        type: string
    secrets:
      SNYK_TOKEN:
        required: false
      OPTIONAL_SECRET:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      READER_TOKEN:
        required: false
      NAIS_WORKLOAD_IDENTITY_PROVIDER: # DEPRECATED: ubrukt, beholdt for bakoverkompatibilitet. Fjern kall til denne i konsument-repoene, så kan den fjernes helt.
        required: false
    outputs:
      image:
        description: "Image from nais build push action"
        value: ${{ jobs.deploy-dev.outputs.image }}
jobs:
  deploy-dev:
    permissions:
      contents: write
      id-token: write
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.CLUSTER }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        name: Set up Docker Buildx
      - name: Setup java
        if: ${{ inputs.LANGUAGE == 'java' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.BUILD_CACHE == 'pnpm' && inputs.LANGUAGE == 'node'}}
        with:
          run_install: false
      - name: Setup Node
        if: ${{ inputs.LANGUAGE == 'node' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Build and test
        run: |
          bash -eo pipefail -c "$BUILD_SCRIPT"
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        env:
          BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
          OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Pre-deploy
        uses: navikt/pam-deploy/actions/pre-deploy@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM: ${{ inputs.TEAM }}
          IMAGE_SUFFIX: ${{ inputs.IMAGE_SUFFIX }}
          DRAFTS_MAX: ${{ inputs.DRAFTS_MAX }}
          VERSION_TAG: ${{ inputs.VERSION_TAG }}
      - name: docker-build-push
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: ${{ inputs.TEAM }}
          tag: ${{ env.VERSION_TAG }}
          dockerfile: "${{ inputs.WORKING_DIRECTORY }}Dockerfile"
          image_suffix: ${{ inputs.IMAGE_SUFFIX }}
          build_args: |
            "VERSION_TAG=${{ env.VERSION_TAG }}"
          build_secrets: |
            "optional_secret=${{ secrets.OPTIONAL_SECRET }}"
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"
            "reader_token=${{ secrets.READER_TOKEN }}"
            "npm_auth_token=${{ secrets.READER_TOKEN }}"
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.docker-build-push.outputs.image }}
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy.sarif"
          category: "trivy-image"
      - name: Deploy to ${{ inputs.CLUSTER }}
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: ${{ inputs.CLUSTER }}
          RESOURCE: ${{ inputs.NAIS_RESOURCE }}
          VARS: ${{ inputs.NAIS_VARS }}
      - name: Post-deploy
        uses: navikt/pam-deploy/actions/post-deploy@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draft release
        if: ${{ !inputs.SKIP_DRAFT_RELEASE && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          DRAFT_NAME: ${{ env.DRAFT_NAME }}
        run: |
          notes_file="$(mktemp)"
          previous_ref="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "$previous_ref" ] || ! git rev-parse -q --verify "$previous_ref^{commit}" >/dev/null; then
            previous_ref="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          {
            echo "[$VERSION_TAG](https://github.com/$GITHUB_REPOSITORY/tree/$VERSION_TAG)"
            echo "[Full Changelog](https://github.com/$GITHUB_REPOSITORY/compare/$previous_ref...$VERSION_TAG)"
            git log "$previous_ref..$GITHUB_SHA" --no-merges --pretty=format:'* %ad %s' -50 --date=short | sed '/^[[:space:]]*$/d'
          } > "$notes_file"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release edit "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          else
            gh release create "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          fi
          rm -f "$notes_file"
  CodeQL:
    if: ${{ inputs.CODEQL_ENABLED }}
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: navikt/pam-deploy/.github/workflows/codeql.yml@v9
    with:
      LANGUAGE: ${{ inputs.LANGUAGE }}
      JAVA_DISTRIBUTION: ${{ inputs.JAVA_DISTRIBUTION }}
      JAVA_VERSION: ${{ inputs.JAVA_VERSION }}
      NODE_VERSION: ${{ inputs.NODE_VERSION }}
      BUILD_CACHE: ${{ inputs.BUILD_CACHE }}
      BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
    secrets:
      OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
