on:
  workflow_call:
    inputs:
      LANGUAGE:
        required: false
        type: string
        default: "java"
      CODEQL_ENABLED:
        required: false
        type: boolean
        default: true
      TEAM:
        required: false
        type: string
        default: "teampam"
      JAVA_DISTRIBUTION:
        required: false
        type: string
        default: "temurin"
      JAVA_VERSION:
        required: false
        type: string
        default: "14"
      NODE_VERSION:
        required: false
        type: string
        default: "14"
      BUILD_CACHE:
        required: false
        type: string
        default: "gradle"
      NAIS_RESOURCE:
        required: false
        type: string
        default: "naiserator.yml"
      NAIS_VARS:
        required: false
        type: string
        default: "naiserator-dev.json"
      CLUSTER:
        required: false
        type: string
        default: "dev-gcp"
      BUILD_SCRIPT:
        required: false
        type: string
        default: "./build.sh"
      WORKING_DIRECTORY:
        required: false
        type: string
        default: "./"
      IMAGE_SUFFIX:
        required: false
        type: string
      SKIP_DRAFT_RELEASE:
        required: false
        type: boolean
        default: false
      DRAFTS_MAX:
        required: false
        type: string
        default: "10"
      VERSION_TAG:
        required: false
        type: string
    secrets:
      SNYK_TOKEN:
        required: false
      OPTIONAL_SECRET:
        required: false
      SENTRY_AUTH_TOKEN:
        required: false
      READER_TOKEN:
        required: false
      NAIS_WORKLOAD_IDENTITY_PROVIDER: # DEPRECATED: ubrukt, beholdt for bakoverkompatibilitet. Fjern kall til denne i konsument-repoene, så kan den fjernes helt.
        required: false
    outputs:
      image:
        description: "Image from nais build push action"
        value: ${{ jobs.deploy-dev.outputs.image }}
jobs:
  deploy-dev:
    permissions:
      contents: write
      id-token: write
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.CLUSTER }}
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        name: Set up Docker Buildx
      - name: Setup java
        if: ${{ inputs.LANGUAGE == 'java' }}
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        if: ${{ inputs.BUILD_CACHE == 'pnpm' && inputs.LANGUAGE == 'node'}}
        with:
          run_install: false
      - name: Setup Node
        if: ${{ inputs.LANGUAGE == 'node' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Build and test
        run: |
          bash -eo pipefail -c "$BUILD_SCRIPT"
        working-directory: ${{ inputs.WORKING_DIRECTORY }}
        env:
          BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
          OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Pre-deploy
        uses: ./actions/pre-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM: ${{ inputs.TEAM }}
          IMAGE_SUFFIX: ${{ inputs.IMAGE_SUFFIX }}
          DRAFTS_MAX: ${{ inputs.DRAFTS_MAX }}
          VERSION_TAG: ${{ inputs.VERSION_TAG }}
      - name: docker-build-push
        uses: nais/docker-build-push@31c3a7321909bcb20799fdf46153fec721fd9512 # v0
        id: docker-build-push
        with:
          team: ${{ inputs.TEAM }}
          tag: ${{ env.VERSION_TAG }}
          dockerfile: "${{ inputs.WORKING_DIRECTORY }}Dockerfile"
          image_suffix: ${{ inputs.IMAGE_SUFFIX }}
          build_args: |
            "VERSION_TAG=${{ env.VERSION_TAG }}"
          build_secrets: |
            "optional_secret=${{ secrets.OPTIONAL_SECRET }}"
            "sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}"
            "reader_token=${{ secrets.READER_TOKEN }}"
            "npm_auth_token=${{ secrets.READER_TOKEN }}"
        env:
          ACTIONS_RUNTIME_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.docker-build-push.outputs.image }}
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          sarif_file: "trivy.sarif"
          category: "trivy-image"
      - name: Deploy to ${{ inputs.CLUSTER }}
        uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
        env:
          CLUSTER: ${{ inputs.CLUSTER }}
          RESOURCE: ${{ inputs.NAIS_RESOURCE }}
          VARS: ${{ inputs.NAIS_VARS }}
      - name: Post-deploy
        uses: ./actions/post-deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draft release
        if: ${{ !inputs.SKIP_DRAFT_RELEASE && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          DRAFT_NAME: ${{ env.DRAFT_NAME }}
        run: |
          notes_file="$(mktemp)"
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$VERSION_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq '.body' > "$notes_file"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release edit "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          else
            gh release create "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          fi
          rm -f "$notes_file"
  CodeQL:
    if: ${{ inputs.CODEQL_ENABLED }}
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: ./.github/workflows/codeql.yml
    with:
      LANGUAGE: ${{ inputs.LANGUAGE }}
      JAVA_DISTRIBUTION: ${{ inputs.JAVA_DISTRIBUTION }}
      JAVA_VERSION: ${{ inputs.JAVA_VERSION }}
      NODE_VERSION: ${{ inputs.NODE_VERSION }}
      BUILD_CACHE: ${{ inputs.BUILD_CACHE }}
      BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
    secrets:
      OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
