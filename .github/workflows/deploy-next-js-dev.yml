on:
  workflow_call:
    inputs:
      TEAM:
        required: false
        type: string
        default: "teampam"
      NODE_VERSION:
        required: false
        type: string
        default: "20"
      PACKAGE_MANAGER:
        required: false
        type: string
        default: "pnpm"
      NAIS_RESOURCE:
        required: false
        type: string
        default: ".nais/nais.yml"
      NAIS_VARS:
        required: false
        type: string
        default: ".nais/dev.yml"
      SKIP_DRAFT_RELEASE:
        required: false
        type: boolean
        default: false
      BUILD_COMMAND:
        required: false
        type: string
        default: "pnpm build"
      INSTALL_DEPENDENCIES_COMMAND:
        required: false
        type: string
        default: "pnpm install --frozen-lockfile"
      IMAGE_SUFFIX:
        required: false
        type: string
      CODEQL_ENABLED:
        required: false
        type: boolean
        default: true
      VERSION_TAG:
        required: false
        type: string
    outputs:
      image:
        description: "Image from nais build push action"
        value: ${{ jobs.deploy-dev.outputs.image }}
jobs:
  deploy-dev:
    permissions:
      contents: write
      id-token: write
      packages: read
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.PACKAGE_MANAGER == 'pnpm' }}
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ inputs.PACKAGE_MANAGER }}
      - name: Next.js npm cache
        if: ${{ inputs.PACKAGE_MANAGER == 'npm' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Install npm dependencies
        if: ${{ inputs.PACKAGE_MANAGER == 'npm' }}
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
        run: |
          npm config set @navikt:registry https://npm.pkg.github.com
          npm config set //npm.pkg.github.com/:_authToken $NPM_AUTH_TOKEN
          npm ci
      - name: Next.js pnpm cache
        if: ${{ inputs.PACKAGE_MANAGER == 'pnpm' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Install pnpm dependencies
        if: ${{ inputs.PACKAGE_MANAGER == 'pnpm' }}
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
          PACKAGE_MANAGER: ${{ inputs.PACKAGE_MANAGER }}
          INSTALL_DEPENDENCIES_COMMAND: ${{ inputs.INSTALL_DEPENDENCIES_COMMAND }}
        run: |
          "$PACKAGE_MANAGER" config set @navikt:registry https://npm.pkg.github.com
          "$PACKAGE_MANAGER" config set //npm.pkg.github.com/:_authToken "$NPM_AUTH_TOKEN"
          bash -eo pipefail -c "$INSTALL_DEPENDENCIES_COMMAND"
      - name: Pre-deploy
        uses: navikt/pam-deploy/actions/pre-deploy@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEAM: ${{ inputs.TEAM }}
          IMAGE_SUFFIX: ${{ inputs.IMAGE_SUFFIX }}
          DRAFTS_MAX: "10"
          VERSION_TAG: ${{ inputs.VERSION_TAG }}
      - name: Run lint
        env:
          PACKAGE_MANAGER: ${{ inputs.PACKAGE_MANAGER }}
        run: |
          "$PACKAGE_MANAGER" run lint
      - name: Run prettier
        env:
          PACKAGE_MANAGER: ${{ inputs.PACKAGE_MANAGER }}
        run: |
          "$PACKAGE_MANAGER" run prettier
      - name: Run tests
        env:
          PACKAGE_MANAGER: ${{ inputs.PACKAGE_MANAGER }}
        run: |
          "$PACKAGE_MANAGER" run test
      - name: Build application
        run: bash -eo pipefail -c "$BUILD_COMMAND"
        env:
          BUILD_COMMAND: ${{ inputs.BUILD_COMMAND }}
          SENTRY_RELEASE: ${{ env.VERSION_TAG }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY || '' }}
      - name: Upload static files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@v2
        with:
          team: ${{ inputs.TEAM }}
          source: ./.next/static
          destination: /${{github.event.repository.name}}/_next
      - name: docker-build-push
        uses: nais/docker-build-push@v0
        id: docker-build-push
        with:
          team: ${{ inputs.TEAM }}
          tag: ${{ env.VERSION_TAG }}
          image_suffix: ${{ inputs.IMAGE_SUFFIX }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.docker-build-push.outputs.image }}
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: "trivy.sarif"
          category: "trivy-image"
      - name: Deploy to dev-gcp
        uses: nais/deploy/actions/deploy@v2
        env:
          CLUSTER: "dev-gcp"
          RESOURCE: ${{ inputs.NAIS_RESOURCE }}
          VARS: ${{ inputs.NAIS_VARS }}
      - name: Post-deploy
        uses: navikt/pam-deploy/actions/post-deploy@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draft release
        if: ${{ !inputs.SKIP_DRAFT_RELEASE }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ env.VERSION_TAG }}
          DRAFT_NAME: ${{ env.DRAFT_NAME }}
        run: |
          notes_file="$(mktemp)"
          previous_ref="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          if [ -z "$previous_ref" ] || ! git rev-parse -q --verify "$previous_ref^{commit}" >/dev/null; then
            previous_ref="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          {
            echo "[$VERSION_TAG](https://github.com/$GITHUB_REPOSITORY/tree/$VERSION_TAG)"
            echo "[Full Changelog](https://github.com/$GITHUB_REPOSITORY/compare/$previous_ref...$VERSION_TAG)"
            git log "$previous_ref..$GITHUB_SHA" --no-merges --pretty=format:'* %ad %s' -50 --date=short | sed '/^[[:space:]]*$/d'
          } > "$notes_file"
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            gh release edit "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          else
            gh release create "$VERSION_TAG" --title "$DRAFT_NAME" --notes-file "$notes_file" --draft
          fi
          rm -f "$notes_file"

  CodeQL:
    if: ${{ inputs.CODEQL_ENABLED }}
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: navikt/pam-deploy/.github/workflows/codeql.yml@v9
    with:
      LANGUAGE: "node"
      BUILD_CACHE: ${{ inputs.PACKAGE_MANAGER }}
      NODE_VERSION: ${{ inputs.NODE_VERSION }}
