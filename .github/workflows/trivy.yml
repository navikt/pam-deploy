name: trivy-scan
# Reusable image vulnerability scan for consumer repos.
# Recommended usage: call on a schedule so new CVEs are caught even without
# code changes. See https://sikkerhet.nav.no/docs/verktoy/trivy
#
# Example (in a consumer repo, .github/workflows/trivy.yml):
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#   jobs:
#     scan:
#       uses: navikt/pam-deploy/.github/workflows/trivy.yml@v9
#       permissions:
#         contents: read
#         id-token: write
#         actions: read
#         security-events: write
#       with:
#         IMAGE: europe-north1-docker.pkg.dev/nais-management-233d/teampam/<app>:latest
on:
  workflow_call:
    inputs:
      IMAGE:
        description: "Full image reference to scan (registry/path:tag)"
        required: true
        type: string
      TEAM:
        required: false
        type: string
        default: "teampam"

jobs:
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # for nais/login
      actions: read # for private repositories
      security-events: write # push sarif to github security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to GAR
        uses: nais/login@v0
        with:
          team: ${{ inputs.TEAM }}
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.IMAGE }}
          format: "sarif"
          output: "trivy.sarif"
          ignore-unfixed: true
          exit-code: "0"
      - name: Upload results to GitHub Security
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: "trivy.sarif"
          category: "trivy-scheduled"
