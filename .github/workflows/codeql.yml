on:
  workflow_call:
    inputs:
      LANGUAGE:
        required: true
        type: string
      JAVA_DISTRIBUTION:
        required: false
        type: string
      JAVA_VERSION:
        required: false
        type: string
      NODE_VERSION:
        required: false
        type: string
      BUILD_CACHE:
        required: true
        type: string
      BUILD_SCRIPT:
        required: false
        type: string
    secrets:
      OPTIONAL_SECRET:
        required: false
      READER_TOKEN:
        required: false
jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ (inputs.LANGUAGE == 'node' && 'javascript') || inputs.LANGUAGE }}
          queries: security-and-quality
      - name: Setup java
        if: ${{ inputs.LANGUAGE == 'java' }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        if: ${{ inputs.BUILD_CACHE == 'pnpm' }}
        with:
          run_install: false
      - name: Setup Node
        if: ${{ inputs.LANGUAGE == 'node' }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
        # To avoid setup-node cache failure.
        # ref. https://github.com/actions/setup-node/issues/1137
      - name: Create pnpm cache directory
        if: ${{ inputs.BUILD_CACHE == 'pnpm' }}
        run: mkdir -vp $(pnpm store path --silent)
      - name: Build and test
        run: |
          bash -eo pipefail -c "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
          OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Gradle Dependency Submission
        if: ${{ inputs.LANGUAGE == 'java' && inputs.BUILD_CACHE == 'gradle'}}
        uses: gradle/actions/dependency-submission@v6
      - name: Maven Dependency Submission
        if: ${{ inputs.LANGUAGE == 'java' && inputs.BUILD_CACHE == 'maven'}}
        uses: advanced-security/maven-dependency-submission-action@v5.0.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:${{ (inputs.LANGUAGE == 'node' && 'javascript') || inputs.LANGUAGE }}"
