on:
  workflow_call:
    inputs:
      LANGUAGE:
        required: true
        type: string
      JAVA_DISTRIBUTION:
        required: false
        type: string
      JAVA_VERSION:
        required: false
        type: string
      NODE_VERSION:
        required: false
        type: string
      BUILD_CACHE:
        required: true
        type: string
      BUILD_SCRIPT:
        required: false
        type: string
    secrets:
      OPTIONAL_SECRET:
        required: false
      READER_TOKEN:
        required: false
jobs:
  analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ (inputs.LANGUAGE == 'node' && 'javascript') || inputs.LANGUAGE }}
          queries: security-and-quality
      - name: Setup java
        if: ${{ inputs.LANGUAGE == 'java' }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: ${{ inputs.JAVA_DISTRIBUTION }}
          java-version: ${{ inputs.JAVA_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: ${{ inputs.BUILD_CACHE == 'pnpm' }}
        with:
          run_install: false
      - name: Setup Node
        if: ${{ inputs.LANGUAGE == 'node' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ inputs.BUILD_CACHE }}
        # To avoid setup-node cache failure.
        # ref. https://github.com/actions/setup-node/issues/1137
      - name: Create pnpm cache directory
        if: ${{ inputs.BUILD_CACHE == 'pnpm' }}
        run: mkdir -vp $(pnpm store path --silent)
      - name: Build and test
        run: |
          bash -eo pipefail -c "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
          OPTIONAL_SECRET: ${{ secrets.OPTIONAL_SECRET }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Gradle Dependency Submission
        if: ${{ inputs.LANGUAGE == 'java' && inputs.BUILD_CACHE == 'gradle'}}
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Maven Dependency Submission
        if: ${{ inputs.LANGUAGE == 'java' && inputs.BUILD_CACHE == 'maven'}}
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ (inputs.LANGUAGE == 'node' && 'javascript') || inputs.LANGUAGE }}"
