name: cd-build-deploy-node
on:
  workflow_call:
    inputs:
      BUILD_SCRIPT:
        description: "Byggeskript i repoet som bygger og tester"
        required: false
        type: string
        default: "./build.sh"
      NODE_VERSION:
        required: false
        type: string
        default: "22"
    secrets:
      READER_TOKEN:
        required: false
    outputs:
      image:
        description: "Image bygget og deployet til dev og prod"
        value: ${{ jobs.build.outputs.image }}
      version_tag:
        description: "Versjonstag brukt for image og git-tag"
        value: ${{ jobs.build.outputs.version_tag }}

jobs:
  detect:
    concurrency:
      group: detect-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_manager: ${{ steps.detect.outputs.package_manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect npm or pnpm
        id: detect
        run: |
          if [ -f yarn.lock ]; then
            echo "::error::yarn støttes ikke. Bruk npm (package-lock.json) eller pnpm (pnpm-lock.yaml)."
            exit 1
          fi
          if [ -f pnpm-lock.yaml ] && [ -f package-lock.json ]; then
            echo "::error::Fant både pnpm-lock.yaml og package-lock.json i repo-roten. Fjern én av dem."
            exit 1
          elif [ -f pnpm-lock.yaml ]; then
            package_manager=pnpm
          elif [ -f package-lock.json ]; then
            package_manager=npm
          else
            echo "::error::Fant verken pnpm-lock.yaml eller package-lock.json i repo-roten."
            exit 1
          fi
          echo "Detected $package_manager"
          echo "package_manager=$package_manager" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    # Nyere run kansellerer eldre bygg, slik at bygg (og dermed deploy) skjer i commit-rekkefølge
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write # nais/docker-build-push
      security-events: write # sarif
      actions: read # sarif
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      version_tag: ${{ steps.build-image.outputs.version_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        if: ${{ needs.detect.outputs.package_manager == 'pnpm' }}
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.NODE_VERSION }}
          cache: ${{ needs.detect.outputs.package_manager }}
      - name: Build and test
        run: bash -eo pipefail -c "$BUILD_SCRIPT"
        env:
          BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build, push and scan image
        id: build-image
        uses: navikt/pam-deploy/actions/build-image@v9
        with:
          reader_token: ${{ secrets.READER_TOKEN }}

  deploy:
    needs: build
    permissions:
      contents: write # git tag
      id-token: write
    uses: navikt/pam-deploy/.github/workflows/cd-deploy.yml@v9
    with:
      IMAGE: ${{ needs.build.outputs.image }}
      VERSION_TAG: ${{ needs.build.outputs.version_tag }}

  CodeQL:
    needs: detect
    permissions:
      contents: write
      security-events: write
      actions: read
    uses: navikt/pam-deploy/.github/workflows/codeql.yml@v9
    with:
      LANGUAGE: node
      NODE_VERSION: ${{ inputs.NODE_VERSION }}
      BUILD_CACHE: ${{ needs.detect.outputs.package_manager }}
      BUILD_SCRIPT: ${{ inputs.BUILD_SCRIPT }}
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}
