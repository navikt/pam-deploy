on:
  workflow_call:
    inputs:
      NAIS_RESOURCE:
        required: false
        type: string
        default: "naiserator.yml"
      NAIS_VARS:
        required: false
        type: string
        default: "naiserator-prod.json"
      CLUSTER:
        required: false
        type: string
        default: "prod-gcp"
      TEAM:
        required: false
        type: string
        default: "teampam"
      IMAGE_SUFFIX:
        required: false
        type: string
      VERSION_TAG:
        required: false
        type: string

env:
  VERSION_TAG: ${{ inputs.VERSION_TAG || github.event.release.tag_name }}

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.CLUSTER }}
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          ref: ${{ env.VERSION_TAG }}
          persist-credentials: false
      - name: pre-production
        uses: navikt/pam-deploy/actions/pre-production@v9
        env:
          TEAM: ${{ inputs.TEAM }}
          IMAGE_SUFFIX: ${{ inputs.IMAGE_SUFFIX }}
      - uses: nais/deploy/actions/deploy@2d18f050f07b6a007864c6a57070ed915d571beb # v2
        name: deploy to ${{ inputs.CLUSTER }}
        env:
          CLUSTER: ${{ inputs.CLUSTER }}
          RESOURCE: ${{ inputs.NAIS_RESOURCE }}
          VARS: ${{ inputs.NAIS_VARS }}
      - name: post-production
        uses: navikt/pam-deploy/actions/post-production@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SUFFIX: ${{ inputs.IMAGE_SUFFIX }}
