name: cd-deploy
on:
  workflow_call:
    inputs:
      IMAGE:
        description: "Image som skal deployes"
        required: true
        type: string
      VERSION_TAG:
        description: "Versjonstag som commiten tagges med etter prod-deploy"
        required: true
        type: string

env:
  TEAM: teampam
  NAIS_MANIFEST: .nais/app.yaml

jobs:
  deploy-dev:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev-gcp
    # Per ref: en ventende deploy kan bare erstattes av en nyere kjøring på samme branch
    concurrency:
      group: deploy-dev-gcp-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1
        with:
          team: ${{ env.TEAM }}
      - name: Deploy to dev-gcp
        env:
          IMAGE: ${{ inputs.IMAGE }}
        run: nais apply "$NAIS_MANIFEST" --environment dev-gcp --set spec.image="$IMAGE" --wait

  deploy-prod:
    needs: deploy-dev
    if: ${{ needs.deploy-dev.result == 'success' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    permissions:
      contents: write # git tag
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod-gcp
    concurrency:
      group: deploy-prod-gcp-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@v1
        with:
          team: ${{ env.TEAM }}
      - name: Deploy to prod-gcp
        env:
          IMAGE: ${{ inputs.IMAGE }}
        run: nais apply "$NAIS_MANIFEST" --environment prod-gcp --set spec.image="$IMAGE" --wait
      - name: Tag commit with version
        uses: navikt/pam-deploy/actions/post-deploy@v9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: ${{ inputs.VERSION_TAG }}
