on:
  workflow_call:
    inputs:
      NAIS_RESOURCE:
        required: false
        type: string
        default: "naiserator.yml"
      CLUSTER:
        required: false
        type: string
        default: "dev-gcp"
      VAR:
        required: false
        type: string
      VARS:
        required: false
        type: string
    secrets:
      NAIS_DEPLOY_APIKEY:
        required: true
jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.CLUSTER }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Process nais doc
        uses: navikt/pam-deploy/actions/documentation@v9
        env:
          CLUSTER: ${{ inputs.CLUSTER }}
          RESOURCE: ${{ inputs.NAIS_RESOURCE }}
          VAR: ${{ inputs.VAR }}
          VARS: ${{ inputs.VARS }}
      - name: commit-push
        run: |
          BRANCH="autogenerated-do-no-delete"
          if ! HEAD_OID=$(gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --jq '.commit.sha' 2>/dev/null); then
            DEFAULT_BRANCH=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')
            DEFAULT_OID=$(gh api "repos/$GITHUB_REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/heads/$BRANCH" \
              -f sha="$DEFAULT_OID" >/dev/null
            HEAD_OID="$DEFAULT_OID"
          fi
          gh api graphql -f query='
            mutation ($repo: String!, $branch: String!, $oid: GitObjectID!, $contents: Base64String!) {
              createCommitOnBranch(input: {
                branch: {
                  repositoryNameWithOwner: $repo,
                  branchName: $branch
                },
                message: {
                  headline: ".doc update for documentation. See https://pam.intern.nav.no/docs/repositories/ for more information"
                },
                fileChanges: {
                  additions: [
                    {
                      path: ".doc/app.json",
                      contents: $contents
                    }
                  ]
                },
                expectedHeadOid: $oid
              }) {
                commit {
                  url
                }
              }
            }' -f repo="$GITHUB_REPOSITORY" -f branch="$BRANCH" -f oid="$HEAD_OID" -f contents="$BASE_CONTENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}