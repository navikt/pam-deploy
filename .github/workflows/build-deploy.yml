name: pam-deploy
on:
  workflow_call:
    inputs:
      working_directory:
        required: false
        type: string
        default: "."
      team:
        required: false
        type: string
        default: "teampam"
      cdn_upload_source:
        required: false
        type: string
        default: ""
      cdn_upload_destination:
        required: false
        type: string
        default: ""
    secrets:
      READER_TOKEN:
        required: false
    outputs:
      image:
        description: "Image bygget og deployet til dev og prod"
        value: ${{ jobs.build.outputs.image }}

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    timeout-minutes: 30
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          working_directory: ${{ inputs.working_directory }}
      - uses: navikt/pam-deploy/actions/dependency-cache/restore@gradle-cache
        with:
          working_directory: ${{ inputs.working_directory }}
      - name: Build and test
        run: mise run build
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
      - uses: navikt/pam-deploy/actions/dependency-cache/save@gradle-cache
      - uses: nais/deploy/actions/cdn-upload/v2@d003bddf74ce5b96fa3056ae60bd4b9b3bbc89ef # v3
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.cdn_upload_source != '' && inputs.cdn_upload_destination != ''
        with:
          team: ${{ inputs.team }}
          source: ${{ inputs.cdn_upload_source }}
          destination: /${{ github.event.repository.name }}/${{ inputs.cdn_upload_destination }}
      - uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        id: docker-build-push
        with:
          team: ${{ inputs.team }}
          dockerfile: ${{ inputs.working_directory }}/Dockerfile
          push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          image_suffix: ${{ inputs.working_directory != '.' && inputs.working_directory || '' }}

  deploy-dev:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    timeout-minutes: 20
    environment: dev-gcp
    concurrency:
      group: deploy-dev-gcp-${{ inputs.working_directory }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: ${{ inputs.team }}
      - name: Deploy to dev-gcp
        run: nais apply .nais/app.yaml --environment dev-gcp --set spec.image="$IMAGE" --wait
        env:
          IMAGE: ${{ needs.build.outputs.image }}

  deploy-prod:
    needs: [build, deploy-dev]
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    timeout-minutes: 20
    environment: prod-gcp
    concurrency:
      group: deploy-prod-gcp-${{ inputs.working_directory }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/setup@fb8692f65df9c904e2cdac5d395630ac876abdcf # v1.0.3
        with:
          team: ${{ inputs.team }}
      - name: Deploy to prod-gcp
        run: nais apply .nais/app.yaml --environment prod-gcp --set spec.image="$IMAGE" --wait
        env:
          IMAGE: ${{ needs.build.outputs.image }}
